name: Slotflow Client CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # - name: Check lint
      #   run: pnpm lint
      
      # - name: Check formatting
      #   run: pnpm format:check

      # - name: Run tests
      #   run: pnpm test:run
      
      # - name: Build project
      #   run:  pnpm build
      
      - name: Validate project
        run: pnpm validate